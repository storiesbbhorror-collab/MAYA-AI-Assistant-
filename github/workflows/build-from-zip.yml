
name: Build MAYA APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'MAYA_Android_Project_v2.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project ZIP
        run: |
          mkdir maya
          unzip -o MAYA_Android_Project_v2.zip -d maya

      - name: Build debug APK
        run: gradle -p maya assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAYA-debug-APK
          path: maya/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
